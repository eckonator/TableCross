[package]
name = "tablecross"
description = "Share mouse, keyboard and clipboard between computers on the local network"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
tc-protocol = { path = "../crates/protocol" }
tc-core = { path = "../crates/core" }
tc-input = { path = "../crates/input" }
tc-net = { path = "../crates/net" }
tc-session = { path = "../crates/session" }
tc-clipboard = { path = "../crates/clipboard" }
anyhow = "1"
png = "0.18"
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "accesskit", "wayland", "x11"] }
serde = { workspace = true }
serde_json = "1"
sys-locale = "0.3"
gethostname = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# On Linux the status icon talks StatusNotifierItem over D-Bus (no GTK needed)
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Window frame with real buttons where the compositor leaves decorations to the app (GNOME on Wayland)
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
