# Tests, Clippy and formatting on every push and pull request, on all three platforms,
# plus license and security checks of the dependencies (cargo-deny).
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The test tool for trying connections between real computers (plus the macOS system helper)
      - name: Build tablecross-cli
        run: cargo build --release -p tablecross-cli -p tablecross-helper
      - uses: actions/upload-artifact@v4
        with:
          name: tablecross-cli-${{ runner.os }}
          path: |
            target/release/tablecross-cli
            target/release/tablecross-cli.exe
            target/release/tablecross-helper
          if-no-files-found: error

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
