# Dependency checks with cargo-deny (run in CI):
# licenses must be compatible with GPL-3.0 (no GPL-2.0-only, nothing proprietary),
# known security advisories fail the build.

[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
ignore = []

[licenses]
allow = [
    "GPL-3.0-or-later",
    "GPL-3.0-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    # Public domain dedication, compatible with the GPL (ksni, the Linux status icon)
    "Unlicense",
]
confidence-threshold = 0.9

# egui embeds its default fonts (Ubuntu-Light, Hack, Noto Emoji); font licenses allow bundling them
# with any software.
[[licenses.exceptions]]
crate = "epaint"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
