[package]
name = "tc-session"
description = "TableCross running session: network, engine and input together, with status and commands"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
tc-protocol = { path = "../protocol" }
tc-core = { path = "../core" }
tc-input = { path = "../input" }
tc-clipboard = { path = "../clipboard" }
tc-net = { path = "../net" }
anyhow = "1"
postcard.workspace = true
serde.workspace = true
unicode-normalization = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tracing = "0.1"
