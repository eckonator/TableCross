[package]
name = "tc-net"
description = "TableCross networking: QUIC endpoint, device identity, pairing, discovery, reconnect"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
tc-protocol = { path = "../protocol" }
serde.workspace = true
postcard.workspace = true
serde_json = "1"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
spake2 = "0.4"
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.3"
mdns-sd = "0.21"
socket2 = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tracing = "0.1"
thiserror = "2"
