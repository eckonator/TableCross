[package]
name = "tc-input"
description = "TableCross input capture and injection per operating system"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
tc-protocol = { path = "../protocol" }
tc-core = { path = "../core" }
thiserror = "2"
tracing = "0.1"
serde.workspace = true
postcard.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"
# Media keys are system events that only AppKit can read and create
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSGraphicsContext", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEventTypes"] }
# Input sources may only be touched on the main thread
dispatch2 = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Shutdown",
    "Win32_System_SystemServices",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["xinput", "xtest", "xfixes", "randr"] }
ashpd = { version = "0.13", default-features = false, features = ["tokio", "input_capture", "remote_desktop", "screencast", "inhibit"] }
reis = { version = "0.7", features = ["tokio"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net"] }
